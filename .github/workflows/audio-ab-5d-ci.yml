name: Audio A/B 5D Software QA CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/math/AudioAB**'
      - 'src/synth/CanonicalPresetSynthesizer**'
      - 'src/tests/test_AudioAB**'
      - 'docs/qa/**'
      # La puerta de contratos esta en este MISMO workflow, asi que sin
      # estas lineas un PR que solo toque un contrato —un snapshot
      # desfasado, un retenido nuevo— no dispararia nada y pasaria en
      # verde sin que nadie mirase. No es un detalle: es el motivo por el
      # que estos ficheros estan aqui y no solo los de audio 5D.
      - 'contracts/**'
      - 'src/tests/test_ContractsSnapshotDrift.cpp'
      - 'src/tests/test_HardwareContractQuarantine.cpp'
      - 'src/core/HardwareContractQuarantine.*'
      - 'src/core/LabResourcePaths.cpp'
      - '.github/workflows/audio-ab-5d-ci.yml'
      - 'CMakeLists.txt'
      - 'tools/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/math/AudioAB**'
      - 'src/synth/CanonicalPresetSynthesizer**'
      - 'src/tests/test_AudioAB**'
      - 'docs/qa/**'
      # La puerta de contratos esta en este MISMO workflow, asi que sin
      # estas lineas un PR que solo toque un contrato —un snapshot
      # desfasado, un retenido nuevo— no dispararia nada y pasaria en
      # verde sin que nadie mirase. No es un detalle: es el motivo por el
      # que estos ficheros estan aqui y no solo los de audio 5D.
      - 'contracts/**'
      - 'src/tests/test_ContractsSnapshotDrift.cpp'
      - 'src/tests/test_HardwareContractQuarantine.cpp'
      - 'src/core/HardwareContractQuarantine.*'
      - 'src/core/LabResourcePaths.cpp'
      - '.github/workflows/audio-ab-5d-ci.yml'
      - 'CMakeLists.txt'
      - 'tools/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  audio-ab-5d-acceptance:
    name: Audio A/B 5D Matrix & Baseline Validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ABDAudioLab

    steps:
      - name: Checkout ABDAudioLab
        uses: actions/checkout@v4
        with:
          path: ABDAudioLab
          fetch-depth: 1

      - name: Checkout ABDSharedCode (Immutable Sibling Ref)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedCode
          ref: 21c0a60c1efd5aac6a6cedcc57725f601a3ce14a
          path: ABDSharedCode
          fetch-depth: 1

      # ESTE HERMANO ES LO QUE HACE QUE EL GATE 7 EXISTA.
      #
      # `LabResourcePaths::sharedAssetsDir()` devuelve un File invalido cuando no
      # encuentra ABDSharedAssets, y el test de drift responde con SKIP a eso, no
      # con verde. Un SKIP no es una pasada, pero tampoco es un fallo: el job
      # estaba en verde sin haber comparado un solo contrato. Sin este checkout el
      # gate de abajo se ejecuta y no comprueba nada.
      #
      # `ref: main` y no un SHA, y aqui la regla es la INVERSA que en los
      # generadores. Alli lo que importa es la cabecera de la que sale el json, y
      # esa se fija para que el fallo sea siempre el mismo. Aqui lo que importa es
      # el ORIGEN del snapshot, y el origen es `main` por definicion: si `main` se
      # mueve y el snapshot no le sigue, el snapshot esta desfasado de verdad, y
      # un rojo por eso es un rojo que se ha ganado. Fijarlo aqui haria que este
      # check solo dijese lo que ya decia el CI de ABDSharedAssets.
      - name: Checkout ABDSharedAssets (contract origin)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedAssets
          ref: 065ca6c6aef82e8d41cf6a94d650ab28f5c27e4c
          path: ABDSharedAssets
          fetch-depth: 1

      - name: Checkout ABDScope (Immutable Sibling Ref)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDScope
          ref: 0a296f3f3d161f65b41be4d02413ab858dddff55
          path: ABDScope
          fetch-depth: 1

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Pinned WebView2 SDK for JUCE
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/v6.10.1/nuget.exe -OutFile nuget.exe
          .\nuget.exe install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Dump CMake Diagnostics on Configure Failure
        if: failure()
        run: |
          if (Test-Path "build\CMakeFiles\CMakeConfigureLog.yaml") {
            Get-Content "build\CMakeFiles\CMakeConfigureLog.yaml" -Tail 150
          }
          if (Test-Path "build\CMakeFiles\CMakeError.log") {
            Get-Content "build\CMakeFiles\CMakeError.log" -Tail 150
          }

      - name: Build Test Executable (ABDAudioLab_Tests)
        run: |
          cmake --build build --config Release --target ABDAudioLab_Tests --parallel

      - name: Gate 1 — Contract & Hermetic Fixtures Validation
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d][comparator][verdict][fixture][hermetic]" -r console

      - name: Gate 2 — Policy & Cases Boundaries Validation
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d][policy]" -r console
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d][metrics]" -r console

      - name: Gate 3 — Canonical Matrix Execution & Artifact Generation
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d][run5d01],[audioab_5d][run5d02],[audioab_5d][run5d03],[audioab_5d][run5d04],[audioab_5d][run5d05],[audioab_5d][run5d06],[audioab_5d][run5d07],[audioab_5d][run5d08],[audioab_5d][run5d09],[audioab_5d][run5d10]" -r console

      - name: Gate 4 — Manifest, Schema & Cryptographic Artifacts Validation
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d][manifest][baseline]" -r console

      - name: Gate 5 — Full 5D Test Suite Non-Regression Gate
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[audioab_5d]" -r console

      - name: Gate 6 — Global Non-VES Suite Baseline Verification
        timeout-minutes: 15
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "~[ves]" -s -r console -d yes

      # El snapshot y la cuarentena, con etiqueta propia y NO dentro de la suite
      # grande. `[contracts]` habria sido mas corto y habria arrastrado trece
      # ficheros de test, dos de ellos de hosting real: un fallo de contrato tiene
      # que leerse como un fallo de contrato.
      - name: Gate 7 — Contract Snapshot & Quarantine Gate
        run: |
          .\build\Release\ABDAudioLab_Tests.exe "[snapshot]" -r console
          .\build\Release\ABDAudioLab_Tests.exe "[quarantine]" -r console

      - name: Upload Test Telemetry on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-telemetry-logs
          path: |
            ${{ runner.temp }}/abdaudiolab-tests/runner/
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────
      # EL CRONOMETRO SE COMPRUEBA A SI MISMO, y este paso es PUERTA de verdad.
      #
      # No es lo mismo que el paso de medir que viene justo despues, y la
      # diferencia es la misma que separa el codigo 1 del codigo 2: aqui no hay
      # nada dependiente de la maquina. Los tests del tool son deterministas,
      # tardan 0,7 s y no tocan la suite de C++, asi que un rojo aqui significa
      # exactamente una cosa —el tool esta roto— y no «hoy la maquina va cargada».
      # Por eso este paso NO lleva continue-on-error y el de medir si.
      #
      # Va antes de medir y no despues por un motivo concreto: si el tool esta
      # roto, la medicion que salga de el no es una medicion mala, es una
      # medicion que no existe con forma de medicion. Despues se podria avisar,
      # pero el resultado ya habria quedado en el log, y hay quien lo lee sin mirar el
      # exit code. Antes, el rojo sale solo y no hay nada que leer por encima.
      #
      # Y aqui va el test del REPARTO DE CODIGOS, que es lo que traduce el
      # codigo del cronometro en codigo de salida del build. Se autocomprueba
      # en el mismo paso por lo mismo que el otro: si el reparto deriva, el
      # cronometro mide bien y el build lo lee mal, y eso no se arregla avisando
      # despues porque el resultado equivocado ya esta escrito.
      - name: Self-check the Timing Tool
        run: |
          node tools/test_build_bat_perf.mjs
          node tools/test_duraciones_suite.mjs

      # El cronometro, aqui y no en un job aparte, porque es el UNICO sitio donde
      # la suite esta compilada. En Ubuntu no compila —el proyecto es JUCE con
      # MSVC— asi que medir en alli seria medir otra cosa.
      #
      # Sale con 1 si un caso se ha puesto lento o ha desaparecido, y NO se
      # comprueba con `if: success()` porque el exit code del paso anterior ya
      # decidio si se llegaba aqui. Es `continue-on-error` por lo mismo que
      # el job de Ubuntu: el tiempo depende de la maquina, y un rojo permanente
      # es peor que no mirar.
      #
      # Se escribe el XML a disco y se sube como artefacto, para poder mirar el
      # tiempo caso por caso en el log sin volver a correr la suite.
      - name: Time the suite (informational)
        continue-on-error: true
        run: |
          node tools\duraciones-suite.mjs 2>&1 | Tee-Object build\suite-timings.txt
          exit 0

      - name: Upload suite timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings
          path: ABDAudioLab/build/suite-timings.txt
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # EL PREFLIGHT DE ABDSharedAssets, CORRIENDO AQUI.
  #
  # Por que otro job y no un paso mas arriba: este corre en Ubuntu y sin
  # compilar nada. Meterlo en el job de Windows lo ataria a un build de varios
  # minutos, y una puerta que solo se puede comprobar despues de una
  # compilacion completa se acaba no comprobando cuando la compilacion falla.
  #
  # QUE COMPRA, CONCRETO. Este preflight es el que mira
  # `ABDAudioLab/contracts/hardware` como COPIA, y es la unica puerta que dice si
  # esa copia esta desfasada o si, siendo una junction, no se esta comprobando
  # nada. El CI de ABDSharedAssets la vigila desde alli, pero alli se compara
  # `main` de ABDSharedAssets contra `main` de ABDSharedAssets: si alguien toca el
  # snapshot del laboratorio y NO toca ABDSharedAssets, alli no se entera nadie.
  # Aqui se ve, porque aqui esta el repo que tiene el snapshot.
  #
  # Sin `paths:` a proposito, igual que el job entero y por el mismo motivo que
  # en el otro repo: un check que no llega a ejecutarse no vigila nada, y en un
  # PR que solo toca un JSON de contrato es justo lo que pasaria.

      - name: Upload QA Acceptance Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-ab-5d-qa-acceptance-reports
          path: |
            ABDAudioLab/docs/qa/runs/*.json
            ABDAudioLab/docs/qa/audio-ab-5d-baseline-manifest.json
            ABDAudioLab/docs/qa/audio-ab-5d-artifacts.sha256
          if-no-files-found: error

  contracts-preflight:
    name: Contract Preflight (origin vs lab snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ABDSharedAssets

    steps:
      # El repo que se quiere vigilar, primero y con su PR entero: es el que
      # lleva los 40 contratos del snapshot.
      - name: Checkout ABDAudioLab
        uses: actions/checkout@v4
        with:
          path: ABDAudioLab
          fetch-depth: 1

      - name: Checkout ABDSharedAssets (contract origin)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedAssets
          ref: 065ca6c6aef82e8d41cf6a94d650ab28f5c27e4c
          path: ABDSharedAssets
          fetch-depth: 1

      # Los generadores de `contracts/` son Python y el runner de Ubuntu no lo
      # trae. Sin este paso el preflight no se puede ni ejecutar, y un preflight
      # que no corre y sale en verde es PEOR que no tenerlo: aparenta que hay
      # puerta. Este comentario, casi literal, esta en el workflow de
      # ABDSharedAssets porque el mismo error ya se cometio una vez alli.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pnpm ANTES de node, no al reves. `pnpm/action-setup` se apoya en el node
      # que deja el paso siguiente en el PATH; con el orden dado del reves, el
      # node instalado se lleva por delante la shim y `pnpm install` deja de ser la
      # version fijada.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.25.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      # Los generadores de contratos leen codigo de ABDSharedCode, ABDEep,
      # ABDNeural y ABDMS2000. Este script baja los que falten a su SHA fijado, y
      # lleva `if: always()` en el workflow de al lado por una razon que aqui se
      # repite: si un checkout falla y el preflight corre igual, el fallo se ve
      # como «no he podido comprobar» y sale con 2, culpando al contrato de un
      # problema del montaje.
      - name: Fetch missing contract sources (pinned SHA)
        run: node scripts/fetch-missing-siblings.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Y por fin la puerta. Sale con 1 si algo esta desfasado, con 2 si no se ha
      # podido comprobar, y 2 tampoco es verde: es «nadie sabe», que no es lo
      # mismo que «todo bien».
      - name: "Preflight: contracts match ABDAudioLab snapshot, quarantine declared"
        run: pnpm run preflight

  # ─────────────────────────────────────────────────────────────────────────
  # EL CRONOMETRO, Y POR QUE ES `continue-on-error`
  #
  # QUE COMPRA, CONCRETO. Una suite que tarda cinco minutos y una que se ha
  # colgado se ven IGUALES desde fuera: el proceso sigue ahi y no escribe. Cuando
  # eso paso aqui, la conclusion fue «esta colgado» y se mato el proceso; al
  # relanzarlo con `-s` termino en tres minutos. El cronometro mide lo que de
  # verdad distingue las dos cosas: si el trabajo AVANZA y cuanto ha costado cada
  # caso, comparado con la referencia.
  #
  # POR QUE NO ES UNA PUERTA QUE ROMPA. Sale con 1 cuando algo se ha puesto lento,
  # y ese 1 esta en `continue-on-error`. Es una decision que se puede discutir:
  # la razon de dejarla asi es que un tiempo de ejecucion depende de la maquina
  # que lo mide, y un runner de GitHub con dos nucleos va a dar numeros que no
  # son los de esta maquina. Ponerlo rigido haria que el primer dia que el CI
  # saliera lento —por lo que sea— dejara de mirar nada, que es lo que le pasa a
  # una puerta roja permanente. Ademas el job del lado ya falla si un test FALLA;
  # esto solo mide CUANTO tardan los que pasan.
  #
  # Y aun asi se sube el XML como artefacto, para que el tiempo se pueda mirar
  # en el log del run sin volver a correr nada.
  suite-timings:
    name: Suite Timings (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout ABDAudioLab
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      # La suite es un binario de Windows. En Ubuntu no compila —el proyecto es
      # JUCE con MSVC—, asi que este job NO mide la suite: comprueba que el
      # cronometro y su test siguen vivos, que es lo que se puede comprobar sin
      # plataforma. La medicion real ocurre en el job de Windows.
      #
      # Sin esto, el cronometro podria romperse —un cambio en el parser, una
      # bandera renombrada— sin que nadie se entere hasta que haya una
      # regresion de verdad que avisar, que es justo cuando ya no es util.
      - name: "Timing tool: its own test suite still passes"
        run: node tools/test_duraciones_suite.mjs

      - name: "Timing tool: parses a real Catch2 XML"
        run: |
          node -e "
          const { leerDuraciones, resumen } = await import('./tools/duraciones-suite.mjs');
          const casos = leerDuraciones('<Catch2TestRun><TestCase name=\"x\" filename=\"a.cpp\"><OverallResult durationInSeconds=\"1.5\"/></TestCase></Catch2TestRun>');
          if (casos.length !== 1 || casos[0].segundos !== 1.5) {
            console.error('el cronometro no lee el XML de Catch2:', JSON.stringify(casos));
            process.exit(1);
          }
          console.log(resumen(casos, 8).join('\n'));
          "
